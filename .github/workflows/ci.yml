name: CI Pipeline

on:
  push:
    branches: [ main, "feature/*" ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    name: Build & Test .NET Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          
      - name: Restore dependencies
        run: dotnet restore TravelCountriesAPI.sln
        
      - name: Build Backend
        run: dotnet build TravelCountriesAPI.sln --no-restore
        
      - name: Run Backend Tests
        run: dotnet test TravelCountriesAPI.sln --no-build --verbosity normal

  test-frontend:
    name: Build & Test React Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./UserInterface
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          
      - name: Install Dependencies
        run: npm install --legacy-peer-deps
        
      - name: Run Frontend Tests
        run: npx vitest run
  deploy-frontend:
    name: Deploy React Frontend to Azure
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    defaults:
      run:
        working-directory: ./UserInterface

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Production Bundle
        env:
          VITE_API_URL: 'https://travel-logistics-api-gzh7chc3gvg4eye8.northcentralus-01.azurewebsites.net'
        run: npm run build

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'travel-logistics-ui-gsc9exabbjhfgcg5'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: './UserInterface/dist'